name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  THEME: zinc

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      kroki:
        image: yuzutech/kroki:0.32.1
        ports:
          - 8000:8000

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install AsciiDoc toolchain
        run: gem install --no-document asciidoctor asciidoctor-pdf asciidoctor-kroki asciidoctor-multipage rouge

      - name: Wait for Kroki
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health >/dev/null && exit 0
            sleep 2
          done
          echo "Kroki did not become healthy" >&2
          exit 1

      - name: Build PDF and HTML
        run: bash build.sh all "$THEME"

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r output/html/. site/
          cp site/main.html site/index.html
          cp output/core-network.pdf site/core-network.pdf
          if grep -rl --include='*.html' 'localhost:8000' site; then
            echo "the HTML pages above reference localhost:8000" >&2
            exit 1
          fi
          if [ ! -f site/pagefind/pagefind-ui.js ]; then
            echo "the Pagefind search index is missing (build.sh runs it through npx)" >&2
            exit 1
          fi

      - name: Add GoatCounter analytics
        if: github.event_name != 'pull_request' && vars.GOATCOUNTER_CODE != ''
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
        run: |
          if ! [[ "$GOATCOUNTER_CODE" =~ ^[a-z0-9-]+$ ]]; then
            echo "GOATCOUNTER_CODE must contain only a-z, 0-9, and '-'" >&2
            exit 1
          fi
          snippet="<script data-goatcounter=\"https://${GOATCOUNTER_CODE}.goatcounter.com/count\" async src=\"//gc.zgo.at/count.js\"></script>"
          find site -name '*.html' -exec sed -i "s|</body>|${snippet}\n</body>|" {} +
          total=$(find site -name '*.html' | wc -l)
          tagged=$(grep -rl --include='*.html' 'data-goatcounter' site | wc -l)
          echo "GoatCounter snippet added to $tagged of $total pages"
          if [ "$tagged" -ne "$total" ]; then
            echo "some pages have no </body> tag" >&2
            exit 1
          fi

      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Add canonical links and sitemap
        if: github.event_name != 'pull_request'
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          base="${BASE_URL%/}/"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            echo "  <url><loc>${base}</loc></url>"
            for f in site/*.html; do
              name=$(basename "$f")
              case "$name" in
                index.html|main.html) url="$base" ;;
                *) url="$base$name"; echo "  <url><loc>${url}</loc></url>" ;;
              esac
              sed -i "s|</head>|<link rel=\"canonical\" href=\"${url}\">\n</head>|" "$f"
            done
            echo '</urlset>'
          } > site/sitemap.xml
          echo "Sitemap: $(grep -c '<loc>' site/sitemap.xml) URLs under $base"

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
