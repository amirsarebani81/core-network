extends: default

page:
  margin: [2.5cm, 2cm, 2.5cm, 2cm]
  numbering:
    start-at: title

base:
  font-size: 10.5
  line-height: 1.35

title-page:
  align: center
  title:
    top: 45%
    font-size: 27
    font-color: 2E4A6B
    line-height: 1.2
  subtitle:
    font-size: 16
    font-color: 5A5A5A
  authors:
    font-size: 13
    font-color: 333333
  revision:
    font-size: 11
    font-color: 5A5A5A

heading:
  font-color: 2E4A6B
  h1:
    font-size: 22
  h2:
    font-size: 17
  h3:
    font-size: 14

header:
  height: 1.5cm
  font-size: 9
  font-color: 5A5A5A
  recto:
    right:
      content: '{section-or-chapter-title}'
    left:
      content: '{document-title}'
  verso:
    right:
      content: '{document-title}'
    left:
      content: '{section-or-chapter-title}'

footer:
  height: 1.5cm
  font-size: 9
  font-color: 5A5A5A
  recto:
    right:
      content: '{page-number}'
  verso:
    left:
      content: '{page-number}'

code:
  font-family: M+ 1mn
  font-size: 9.5
  background-color: F5F5F5
  border-color: DDDDDD

link:
  font-color: 2E6B9E

table:
  head:
    background-color: 2E4A6B
    font-color: FFFFFF
