extends: default

page:
  margin: [2.5cm, 2cm, 2.5cm, 2cm]
  numbering:
    start-at: title

base:
  font-size: 9.5
  line-height: 1.3

title-page:
  align: center
  title:
    top: 45%
    font-size: 24
    font-color: 2E4A6B
    line-height: 1.2
  subtitle:
    font-size: 14
    font-color: 5A5A5A
  authors:
    font-size: 12
    font-color: 333333
  revision:
    font-size: 10
    font-color: 5A5A5A

heading:
  font-color: 2E4A6B
  h1:
    font-size: 20
  h2:
    font-size: 16
  h3:
    font-size: 13

header:
  height: 1.5cm
  font-size: 8.5
  font-color: 5A5A5A
  recto:
    right:
      content: '{section-or-chapter-title}'
    left:
      content: '{document-title}'
  verso:
    right:
      content: '{document-title}'
    left:
      content: '{section-or-chapter-title}'

footer:
  height: 1.5cm
  font-size: 8.5
  font-color: 5A5A5A
  recto:
    right:
      content: '{page-number}'
  verso:
    left:
      content: '{page-number}'

code:
  font-family: M+ 1mn
  font-size: 9
  background-color: F5F5F5
  border-color: DDDDDD

codespan:
  font-color: $base_font_color

link:
  font-color: 2E6B9E

image:
  align: center

table:
  border-color: C8D3DE
  align: center
  font-size: 8
  head:
    background-color: 2E4A6B
    font-color: FFFFFF
  body:
    stripe-background-color: F4F7FA

caption:
  font-color: 5A5A5A
  align: center
